name: Build PS4 Fan Control PayLoad

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            lld-18 \
            llvm-18 \
            make \
            git \
            curl \
            xz-utils \
            ca-certificates

      - name: Checkout PS4 payload SDK
        uses: actions/checkout@v4
        with:
          repository: ps4-payload-dev/sdk
          ref: v0.9
          path: .ps4-payload-sdk
          fetch-depth: 1

      - name: Install PS4 payload SDK
        run: |
          sudo make -C .ps4-payload-sdk install DESTDIR=/opt/ps4-payload-sdk
          echo "PS4_PAYLOAD_SDK=/opt/ps4-payload-sdk" >> "$GITHUB_ENV"

      - name: Show toolchain and SDK revision
        run: |
          clang-18 --version
          ld.lld-18 --version
          git -C .ps4-payload-sdk rev-parse --short HEAD
          test -d "$PS4_PAYLOAD_SDK"

      - name: Build ELF
        run: |
          make clean || true
          make

      - name: Validate artifact
        run: |
          test -f fan_control.elf
          file fan_control.elf
          ls -lh fan_control.elf

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: fan-control-payload
          path: fan_control.elf
          if-no-files-found: error
          retention-days: 30

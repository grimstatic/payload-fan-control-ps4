name: Build PS4 Fan Control PayLoad

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 make wget unzip file binutils

      - name: Install PS4 payload SDK v0.9
        run: |
          wget -q https://github.com/ps4-payload-dev/sdk/releases/download/v0.9/ps4-payload-sdk.zip
          sudo unzip -q ps4-payload-sdk.zip -d /opt
          test -d /opt/ps4-payload-sdk
          echo "PS4_PAYLOAD_SDK=/opt/ps4-payload-sdk" >> "$GITHUB_ENV"

      - name: Show build environment
        run: |
          clang-18 --version
          ld.lld-18 --version
          test -f "$PS4_PAYLOAD_SDK/toolchain/orbis.mk"

      - name: Build ELF
        run: |
          make clean
          make

      - name: Validate ELF
        run: |
          test -f fan_control.elf
          file fan_control.elf
          readelf -h fan_control.elf
          ls -lh fan_control.elf

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps4-fan-control-payload
          path: fan_control.elf
          if-no-files-found: error
          retention-days: 30
